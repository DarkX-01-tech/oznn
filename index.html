<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Metro Rush</title>
    <style>
      :root {
        --cyan: #4cecff;
        --pink: #ff4d78;
        --gold: #ffd34f;
        --panel: #071426e8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050914;
        color: #fff;
        font-family: Inter, Arial, sans-serif;
      }
      body {
        touch-action: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        padding: 18px 22px;
        pointer-events: none;
        text-shadow: 0 3px 8px #000;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .metric {
        font-size: 18px;
        line-height: 1.55;
      }
      .metric b {
        color: var(--cyan);
      }
      .metric .gold {
        color: var(--gold);
      }
      #status {
        position: fixed;
        z-index: 6;
        top: 88px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: var(--cyan);
        text-shadow: 0 2px 6px #000;
        pointer-events: none;
      }
      #menu {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #020617aa, #020617e8);
        padding: 20px;
      }
      #card {
        width: min(560px, 94vw);
        padding: 38px 30px;
        border: 1px solid #4cecff66;
        border-radius: 26px;
        text-align: center;
        background: var(--panel);
        box-shadow:
          0 0 90px #00d9ff22,
          inset 0 0 40px #173a6133;
      }
      #logo {
        margin: 0;
        color: var(--cyan);
        font-size: clamp(40px, 10vw, 76px);
        line-height: 1;
        font-weight: 1000;
        letter-spacing: 0.04em;
        text-shadow: 0 0 22px #00d9ff99;
      }
      #tag {
        margin: 18px auto 28px;
        color: #c4d2ec;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 13px;
        padding: 14px 28px;
        color: #04111d;
        background: var(--cyan);
        font: 800 16px inherit;
        cursor: pointer;
        box-shadow: 0 8px 30px #00d9ff33;
      }
      button:hover {
        filter: brightness(1.12);
      }
      #instructions {
        margin-top: 22px;
        color: #9fb3d5;
        font-size: 13px;
        line-height: 1.85;
      }
      .hidden {
        display: none !important;
      }
      #touch {
        position: fixed;
        z-index: 7;
        left: 0;
        right: 0;
        bottom: 18px;
        display: flex;
        justify-content: space-between;
        padding: 0 18px;
        pointer-events: none;
      }
      .touch-group {
        display: flex;
        gap: 10px;
      }
      .touch {
        width: 58px;
        height: 52px;
        padding: 0;
        color: #eaf7ff;
        background: #10294acc;
        border: 1px solid #6fdfff55;
        pointer-events: auto;
        font-size: 24px;
      }
      #pause {
        position: fixed;
        right: 20px;
        top: 96px;
        z-index: 7;
        width: 42px;
        height: 38px;
        padding: 0;
        background: #10294acc;
        color: #fff;
        font-size: 17px;
        pointer-events: auto;
      }
      #progress {
        position: fixed;
        left: 50%;
        bottom: 18px;
        transform: translateX(-50%);
        width: min(280px, 44vw);
        height: 5px;
        border-radius: 9px;
        background: #ffffff22;
        z-index: 6;
        pointer-events: none;
        overflow: hidden;
      }
      #progress i {
        display: block;
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--cyan), var(--pink));
        transition: width 0.1s;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="metric">
        SKOR <b id="score">0</b><br /><span class="gold"
          >● <b id="coins">0</b></span
        >
      </div>
      <div class="metric" style="text-align: right">
        SEVİYE <b id="level">1</b><br />REKOR <b id="high">0</b>
      </div>
    </div>
    <div id="status"></div>
    <button id="pause" class="hidden">Ⅱ</button>
    <div id="progress"><i id="progressBar"></i></div>
    <div id="menu">
      <div id="card">
        <h1 id="logo">METRO RUSH</h1>
        <p id="tag">
          Şehrin neon raylarında hızlan. Trenlerden kaç, güçlendirmeleri topla
          ve rekorunu kır.
        </p>
        <button id="start">BAŞLA</button>
        <div id="instructions">
          A/D veya ←/→: şerit değiştir<br />W/↑/SPACE: zıpla · S/↓: kay<br />Mobil:
          ekranda kaydır · P: duraklat
        </div>
      </div>
    </div>
    <div id="touch">
      <div class="touch-group">
        <button class="touch" id="left">‹</button
        ><button class="touch" id="right">›</button>
      </div>
      <div class="touch-group">
        <button class="touch" id="jump">↑</button
        ><button class="touch" id="slide">↓</button>
      </div>
    </div>
    <script>
      "use strict";
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const ui = {
        score: document.getElementById("score"),
        coins: document.getElementById("coins"),
        level: document.getElementById("level"),
        high: document.getElementById("high"),
        status: document.getElementById("status"),
        menu: document.getElementById("menu"),
        logo: document.getElementById("logo"),
        tag: document.getElementById("tag"),
        start: document.getElementById("start"),
        pause: document.getElementById("pause"),
        bar: document.getElementById("progressBar"),
      };
      const TAU = Math.PI * 2;
      const lanes = [-1, 0, 1];
      let width = 0;
      let height = 0;
      let ratio = 1;
      let lastTime = 0;
      let running = false;
      let ended = false;
      let paused = false;
      let elapsed = 0;
      let score = 0;
      let coins = 0;
      let high = Number(localStorage.getItem("metroRushHigh") || 0);
      let lane = 1;
      let targetLane = 1;
      let jumpY = 0;
      let jumpVelocity = 0;
      let slideTimer = 0;
      let speed = 26;
      let spawnTimer = 0.7;
      let coinTimer = 0.4;
      let shake = 0;
      let shield = 0;
      let magnet = 0;
      let boost = 0;
      let combo = 0;
      let comboTimer = 0;
      let distance = 0;
      let weatherTimer = 0;
      let weather = "clear";
      let pointerOrigin = { x: 0, y: 0 };
      let audioContext = null;
      const objects = [];
      const particles = [];
      const sparks = [];
      const clouds = [];
      const stars = [];
      const buildings = [];
      const rain = [];
      const keys = new Set();
      const player = { x: 0, y: 0, w: 1, h: 2.5 };
      const palette = {
        road: "#0a1022",
        roadEdge: "#29446f",
        grid: "#243c69",
        cyan: "#46e9f4",
        cyanDark: "#087b9a",
        pink: "#f03c63",
        gold: "#ffd04b",
        purple: "#b95cff",
        green: "#9cff69",
        skin: "#ffc09c",
        hair: "#111a31",
        shadow: "#0008",
      };
      function random(min, max) {
        return Math.random() * (max - min) + min;
      }
      function integer(min, max) {
        return Math.floor(random(min, max + 1));
      }
      function choose(list) {
        return list[integer(0, list.length - 1)];
      }
      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }
      function laneScreen(index) {
        return width * 0.5 + index * Math.min(width * 0.17, 145);
      }
      function resize() {
        ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        createBackground();
      }
      function createBackground() {
        stars.length = 0;
        clouds.length = 0;
        buildings.length = 0;
        rain.length = 0;
        for (let i = 0; i < Math.max(80, width / 12); i++)
          stars.push({
            x: random(0, width),
            y: random(0, height * 0.6),
            size: random(0.4, 2),
            phase: random(0, TAU),
          });
        for (let i = 0; i < 16; i++)
          clouds.push({
            x: random(-100, width + 100),
            y: random(60, height * 0.38),
            w: random(80, 240),
            h: random(18, 50),
            speed: random(2, 8),
          });
        for (let i = 0; i < 22; i++)
          buildings.push({
            side: i % 2 ? 1 : -1,
            z: -i * 9 - random(0, 12),
            w: random(35, 90),
            h: random(45, 180),
            color: choose(["#101d3c", "#15284d", "#1b315d", "#202950"]),
          });
        for (let i = 0; i < 100; i++)
          rain.push({
            x: random(0, width),
            y: random(0, height),
            length: random(8, 22),
            speed: random(280, 480),
            alpha: random(0.12, 0.4),
          });
      }
      function resetGame() {
        running = true;
        ended = false;
        paused = false;
        elapsed = 0;
        score = 0;
        coins = 0;
        lane = 1;
        targetLane = 1;
        jumpY = 0;
        jumpVelocity = 0;
        slideTimer = 0;
        speed = 26;
        spawnTimer = 0.65;
        coinTimer = 0.5;
        shake = 0;
        shield = 0;
        magnet = 0;
        boost = 0;
        combo = 0;
        comboTimer = 0;
        distance = 0;
        weatherTimer = random(22, 38);
        weather = "clear";
        objects.length = 0;
        particles.length = 0;
        sparks.length = 0;
        player.x = 0;
        ui.menu.classList.add("hidden");
        ui.pause.classList.remove("hidden");
        ui.status.textContent = "";
        startAudio();
      }
      function startAudio() {
        try {
          audioContext =
            audioContext ||
            new (window.AudioContext || window.webkitAudioContext)();
          if (audioContext.state === "suspended") audioContext.resume();
        } catch (error) {
          audioContext = null;
        }
      }
      function beep(frequency, duration = 0.08, type = "sine", volume = 0.03) {
        if (!audioContext) return;
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = type;
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(volume, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + duration,
        );
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start();
        oscillator.stop(audioContext.currentTime + duration);
      }
      function move(direction) {
        if (running && !paused) {
          targetLane = clamp(targetLane + direction, 0, 2);
          beep(220, 0.04, "square", 0.018);
        }
      }
      function jump() {
        if (running && !paused && jumpY === 0) {
          jumpVelocity = 18;
          beep(440, 0.1, "triangle", 0.025);
        }
      }
      function slide() {
        if (running && !paused) {
          slideTimer = 0.72;
          beep(130, 0.08, "sawtooth", 0.018);
        }
      }
      function togglePause() {
        if (!running) return;
        paused = !paused;
        ui.status.textContent = paused ? "DURAKLATILDI" : "";
        ui.pause.textContent = paused ? "▶" : "Ⅱ";
      }
      function addObject(type, laneIndex, z, extra = {}) {
        objects.push({
          type,
          lane: laneIndex,
          z,
          hit: false,
          spin: random(0, TAU),
          phase: random(0, TAU),
          ...extra,
        });
      }
      function spawnCoins() {
        const selected = integer(0, 2);
        const count = integer(5, 9);
        for (let i = 0; i < count; i++)
          addObject("coin", selected, -125 - i * 5.7);
        if (Math.random() < 0.28) {
          const other = (selected + choose([1, 2])) % 3;
          addObject("coin", other, -151);
        }
      }
      function spawnObstaclePattern() {
        const selected = integer(0, 2);
        const roll = Math.random();
        if (roll < 0.3) addObject("train", selected, -128);
        else if (roll < 0.48) addObject("barrier", selected, -128);
        else if (roll < 0.62) addObject("low", selected, -128);
        else if (roll < 0.76) addObject("high", selected, -128);
        else if (roll < 0.88) {
          addObject("barrier", selected, -128);
          addObject("barrier", (selected + 1) % 3, -128);
        } else {
          addObject("train", selected, -128);
          addObject("coin", (selected + 1) % 3, -135);
          addObject("coin", (selected + 2) % 3, -142);
        }
      }
      function spawnPower() {
        const type = choose(["shield", "magnet", "boost"]);
        addObject(type, integer(0, 2), -132);
      }
      function spawnWorld() {
        const level = getLevel();
        spawnTimer = Math.max(0.42, 1.08 - level * 0.035) * random(0.75, 1.15);
        if (Math.random() < 0.11) spawnPower();
        else spawnObstaclePattern();
      }
      function getLevel() {
        return 1 + Math.floor(score / 1150);
      }
      function project(z) {
        const progress = clamp((z + 128) / 140, 0, 1);
        return {
          progress,
          y: height * 0.28 + progress * height * 0.68,
          scale: 0.18 + progress * 1.35,
        };
      }
      function emitBurst(x, y, color, count = 20) {
        for (let i = 0; i < count; i++)
          particles.push({
            x,
            y,
            vx: random(-190, 190),
            vy: random(-360, -50),
            gravity: 700,
            size: random(2, 7),
            life: random(0.35, 0.9),
            max: 0.9,
            color,
          });
      }
      function emitSpark(x, y, color) {
        sparks.push({
          x,
          y,
          life: 0.5,
          color,
          size: random(3, 8),
          rotation: random(0, TAU),
        });
      }
      function collectObject(object) {
        const view = project(object.z);
        const x = laneScreen(object.lane);
        const y = view.y;
        if (object.type === "coin") {
          coins++;
          combo++;
          comboTimer = 2.2;
          score += 35 + combo * 2;
          emitBurst(x, y - 35 * view.scale, palette.gold, 8);
          beep(760, 0.06, "triangle", 0.025);
          return;
        }
        if (object.type === "shield") {
          shield = 9;
          emitBurst(x, y - 45 * view.scale, palette.cyan, 22);
          beep(520, 0.15, "sine", 0.04);
          return;
        }
        if (object.type === "magnet") {
          magnet = 11;
          emitBurst(x, y - 45 * view.scale, palette.purple, 22);
          beep(620, 0.15, "sine", 0.04);
          return;
        }
        if (object.type === "boost") {
          boost = 8;
          emitBurst(x, y - 45 * view.scale, palette.green, 22);
          beep(900, 0.15, "sine", 0.04);
          return;
        }
        const safe =
          (object.type === "low" && jumpY > 4.5) ||
          (object.type === "high" && slideTimer > 0);
        if (safe) {
          score += 20;
          emitSpark(x, y - 25 * view.scale, palette.cyan);
          return;
        }
        if (shield > 0) {
          shield = 0;
          shake = 0.45;
          emitBurst(laneScreen(lane), height * 0.78, palette.cyan, 36);
          beep(90, 0.2, "sawtooth", 0.05);
          return;
        }
        endGame();
      }
      function endGame() {
        running = false;
        ended = true;
        high = Math.max(high, Math.floor(score));
        localStorage.setItem("metroRushHigh", String(high));
        ui.logo.textContent = "OYUN BİTTİ";
        ui.tag.textContent = `Skor: ${Math.floor(score)} · Coin: ${coins} · Rekor: ${high}`;
        ui.start.textContent = "TEKRAR OYNA";
        ui.menu.classList.remove("hidden");
        ui.pause.classList.add("hidden");
        emitBurst(laneScreen(lane), height * 0.76, palette.pink, 48);
        beep(65, 0.45, "sawtooth", 0.05);
      }
      function update(dt) {
        if (!running || paused) return;
        elapsed += dt;
        distance += speed * dt;
        const level = getLevel();
        speed = Math.min(53, 26 + level * 1.8 + (boost > 0 ? 16 : 0));
        score += dt * speed * 2.15;
        targetLane = clamp(targetLane, 0, 2);
        lane += (targetLane - lane) * Math.min(1, dt * 12);
        jumpY += jumpVelocity * dt;
        jumpVelocity -= 42 * dt;
        if (jumpY < 0) {
          jumpY = 0;
          jumpVelocity = 0;
        }
        if (slideTimer > 0) slideTimer -= dt;
        if (shield > 0) shield -= dt;
        if (magnet > 0) magnet -= dt;
        if (boost > 0) boost -= dt;
        if (comboTimer > 0) comboTimer -= dt;
        else combo = 0;
        spawnTimer -= dt;
        coinTimer -= dt;
        weatherTimer -= dt;
        if (spawnTimer <= 0) spawnWorld();
        if (coinTimer <= 0) {
          spawnCoins();
          coinTimer = random(1.1, 2.1);
        }
        if (weatherTimer <= 0) {
          weather = weather === "clear" ? "rain" : "clear";
          weatherTimer = random(22, 38);
        }
        for (const object of objects) {
          object.z += speed * dt;
          object.spin += dt * (object.type === "coin" ? 6 : 1.4);
          if (
            object.type === "coin" &&
            magnet > 0 &&
            object.z > -42 &&
            object.z < 13
          )
            object.lane += (lane - object.lane) * dt * 7;
          if (
            !object.hit &&
            object.z > 2 &&
            object.z < 13 &&
            Math.abs(object.lane - lane) < 0.34
          ) {
            object.hit = true;
            collectObject(object);
          }
        }
        for (let i = objects.length - 1; i >= 0; i--)
          if (
            objects[i].z > 24 ||
            (objects[i].hit && objects[i].type === "coin")
          )
            objects.splice(i, 1);
        updateParticles(dt);
        updateBackground(dt);
        updateUi(level);
        if (shake > 0) shake -= dt;
      }
      function updateParticles(dt) {
        for (const particle of particles) {
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += particle.gravity * dt;
          particle.life -= dt;
        }
        for (let i = particles.length - 1; i >= 0; i--)
          if (particles[i].life <= 0) particles.splice(i, 1);
        for (const spark of sparks) {
          spark.life -= dt;
          spark.size *= 0.96;
        }
        for (let i = sparks.length - 1; i >= 0; i--)
          if (sparks[i].life <= 0) sparks.splice(i, 1);
      }
      function updateBackground(dt) {
        for (const cloud of clouds) {
          cloud.x += cloud.speed * dt;
          if (cloud.x > width + 180) cloud.x = -220;
        }
        for (const building of buildings) {
          building.z += speed * dt * 0.22;
          if (building.z > 25) building.z = -235;
        }
        for (const drop of rain) {
          drop.y += drop.speed * dt;
          if (drop.y > height) drop.y = -drop.length;
          drop.x -= speed * dt * 0.08;
        }
      }
      function updateUi(level) {
        ui.score.textContent = Math.floor(score);
        ui.coins.textContent = coins;
        ui.level.textContent = level;
        ui.high.textContent = high;
        ui.bar.style.width = `${Math.min(100, (score % 1150) / 11.5)}%`;
        const status = [];
        if (boost > 0) status.push(`HIZ ${boost.toFixed(1)}`);
        if (magnet > 0) status.push(`MIKNATIS ${magnet.toFixed(1)}`);
        if (shield > 0) status.push(`KALKAN ${shield.toFixed(1)}`);
        if (combo > 1) status.push(`KOMBO x${combo}`);
        ui.status.textContent = status.join("  ·  ");
      }
      function drawSky() {
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, "#050719");
        gradient.addColorStop(0.55, "#112b60");
        gradient.addColorStop(1, "#c64c6b");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);
        const moonX = width * 0.79;
        const moonY = height * 0.18;
        ctx.fillStyle = "#ffdc7a";
        ctx.beginPath();
        ctx.arc(moonX, moonY, 40, 0, TAU);
        ctx.fill();
        ctx.fillStyle = "#ffffff12";
        ctx.beginPath();
        ctx.arc(moonX, moonY, 67, 0, TAU);
        ctx.fill();
        for (const star of stars) {
          ctx.globalAlpha = 0.35 + Math.sin(elapsed * 2 + star.phase) * 0.25;
          ctx.fillStyle = "#fff";
          ctx.fillRect(star.x, star.y, star.size, star.size);
        }
        ctx.globalAlpha = 1;
        for (const cloud of clouds) {
          ctx.fillStyle = "#ffffff08";
          ctx.beginPath();
          ctx.ellipse(cloud.x, cloud.y, cloud.w, cloud.h, 0, 0, TAU);
          ctx.fill();
        }
        drawCityline();
      }
      function drawCityline() {
        for (const building of buildings) {
          const x =
            width * 0.5 +
            building.side * (width * 0.31 + Math.abs(building.z) * 0.04);
          const y = height * 0.62 - building.h;
          const w = building.w * (1 + Math.abs(building.z) / 180);
          ctx.fillStyle = building.color;
          ctx.fillRect(x, y, w, building.h);
          ctx.fillStyle = "#ffd76a";
          for (let row = 0; row < Math.max(2, building.h / 30); row++)
            for (let col = 0; col < 3; col++)
              if ((row + col + Math.floor(Math.abs(building.z))) % 3 === 0)
                ctx.fillRect(x + 8 + col * 15, y + 12 + row * 24, 5, 6);
        }
      }
      function drawRoad() {
        const top = height * 0.27;
        const bottom = height * 1.04;
        ctx.fillStyle = palette.road;
        ctx.beginPath();
        ctx.moveTo(width * 0.42, top);
        ctx.lineTo(width * 0.58, top);
        ctx.lineTo(width * 0.99, bottom);
        ctx.lineTo(width * 0.01, bottom);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = palette.roadEdge;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(width * 0.42, top);
        ctx.lineTo(width * 0.01, bottom);
        ctx.moveTo(width * 0.58, top);
        ctx.lineTo(width * 0.99, bottom);
        ctx.stroke();
        for (let i = 0; i < 17; i++) {
          const p = (i / 17 + (elapsed * speed) / 850) % 1;
          const y = top + p * (bottom - top);
          const left = width * 0.42 - p * width * 0.41;
          const right = width * 0.58 + p * width * 0.41;
          ctx.strokeStyle = `rgba(72,113,184,${0.16 + p * 0.55})`;
          ctx.lineWidth = 2 + p * 4;
          ctx.beginPath();
          ctx.moveTo(left, y);
          ctx.lineTo(right, y);
          ctx.stroke();
        }
        for (let i = 1; i < 3; i++) {
          ctx.strokeStyle = palette.grid;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(width * 0.42 + (i * width * 0.16) / 3, top);
          ctx.lineTo(width * 0.01 + (i * width * 0.98) / 3, bottom);
          ctx.stroke();
        }
      }
      function drawObject(object) {
        const view = project(object.z);
        const px = laneScreen(object.lane);
        const py = view.y;
        const scale = view.scale;
        if (object.type === "coin") {
          drawCoin(px, py - 34 * scale, scale, object);
          return;
        }
        if (["shield", "magnet", "boost"].includes(object.type)) {
          drawPower(px, py - 52 * scale, scale, object);
          return;
        }
        ctx.save();
        ctx.translate(px, py);
        const widthObject = 48 * scale;
        let objectHeight = 62 * scale;
        let color = palette.purple;
        if (object.type === "train") {
          objectHeight = 112 * scale;
          color = palette.pink;
        }
        if (object.type === "barrier") {
          objectHeight = 65 * scale;
          color = palette.pink;
        }
        if (object.type === "low") {
          objectHeight = 34 * scale;
          color = palette.purple;
        }
        if (object.type === "high") {
          objectHeight = 96 * scale;
          color = palette.gold;
        }
        ctx.shadowColor = color;
        ctx.shadowBlur = 18;
        ctx.fillStyle = color;
        ctx.fillRect(
          -widthObject / 2,
          -objectHeight,
          widthObject,
          objectHeight,
        );
        ctx.shadowBlur = 0;
        if (object.type === "train") {
          ctx.fillStyle = "#d9faff";
          ctx.fillRect(
            -widthObject * 0.33,
            -objectHeight * 0.82,
            widthObject * 0.66,
            objectHeight * 0.21,
          );
          ctx.fillStyle = "#fff";
          ctx.fillRect(
            -widthObject * 0.3,
            -objectHeight * 0.55,
            widthObject * 0.15,
            widthObject * 0.12,
          );
          ctx.fillRect(
            widthObject * 0.15,
            -objectHeight * 0.55,
            widthObject * 0.15,
            widthObject * 0.12,
          );
        }
        ctx.fillStyle = palette.gold;
        for (let i = -1; i < 2; i++)
          ctx.fillRect(
            i * 15 * scale,
            -objectHeight * 0.7,
            6 * scale,
            objectHeight * 0.2,
          );
        if (object.type === "high") {
          ctx.fillStyle = palette.roadEdge;
          ctx.fillRect(
            -widthObject * 0.55,
            -objectHeight,
            widthObject * 0.1,
            objectHeight,
          );
          ctx.fillRect(
            widthObject * 0.45,
            -objectHeight,
            widthObject * 0.1,
            objectHeight,
          );
        }
        ctx.restore();
      }
      function drawCoin(px, py, scale, object) {
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(object.spin);
        ctx.fillStyle = palette.gold;
        ctx.shadowColor = palette.gold;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.ellipse(0, 0, 17 * scale, 25 * scale, 0, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#9b6414";
        ctx.font = `800 ${18 * scale}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("$", 0, 1 * scale);
        ctx.restore();
      }
      function drawPower(px, py, scale, object) {
        const color =
          object.type === "shield"
            ? palette.cyan
            : object.type === "magnet"
              ? palette.purple
              : palette.green;
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(object.spin);
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 22;
        ctx.beginPath();
        ctx.arc(0, 0, 21 * scale, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#071426";
        ctx.font = `900 ${17 * scale}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(
          object.type === "shield" ? "S" : object.type === "magnet" ? "M" : "B",
          0,
          1,
        );
        ctx.restore();
      }
      function drawPlayer() {
        const px = laneScreen(lane);
        const py = height * 0.82 - jumpY;
        const crouched = slideTimer > 0;
        const bodyScale = crouched ? 0.6 : 1;
        ctx.save();
        ctx.translate(px, py);
        ctx.scale(1, bodyScale);
        ctx.fillStyle = palette.shadow;
        ctx.beginPath();
        ctx.ellipse(0, 14, 39, 11, 0, 0, TAU);
        ctx.fill();
        ctx.fillStyle = palette.cyan;
        ctx.shadowColor = palette.cyan;
        ctx.shadowBlur = 20;
        ctx.fillRect(-19, -64, 38, 56);
        ctx.shadowBlur = 0;
        ctx.fillStyle = palette.skin;
        ctx.beginPath();
        ctx.arc(0, -82, 18, 0, TAU);
        ctx.fill();
        ctx.fillStyle = palette.hair;
        ctx.beginPath();
        ctx.arc(0, -87, 19, Math.PI, TAU);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.fillRect(-9, -83, 5, 4);
        ctx.fillRect(4, -83, 5, 4);
        ctx.strokeStyle = "#15223f";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(-10, -8);
        ctx.lineTo(-19, 22);
        ctx.moveTo(10, -8);
        ctx.lineTo(19, 22);
        ctx.stroke();
        ctx.fillStyle = palette.pink;
        ctx.fillRect(-25, -22, 50, 8);
        if (shield > 0) {
          ctx.strokeStyle = palette.cyan;
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, -40, 51 + Math.sin(elapsed * 8) * 4, 0, TAU);
          ctx.stroke();
        }
        ctx.restore();
      }
      function drawParticles() {
        for (const particle of particles) {
          ctx.globalAlpha = clamp(particle.life / particle.max, 0, 1);
          ctx.fillStyle = particle.color;
          ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
        }
        for (const spark of sparks) {
          ctx.globalAlpha = clamp(spark.life * 2, 0, 1);
          ctx.save();
          ctx.translate(spark.x, spark.y);
          ctx.rotate(spark.rotation);
          ctx.fillStyle = spark.color;
          ctx.fillRect(
            -spark.size / 2,
            -spark.size / 2,
            spark.size * 2,
            spark.size / 2,
          );
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      }
      function drawWeather() {
        if (weather !== "rain") return;
        ctx.strokeStyle = "#7edbff55";
        ctx.lineWidth = 1;
        for (const drop of rain) {
          ctx.globalAlpha = drop.alpha;
          ctx.beginPath();
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - 4, drop.y + drop.length);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      function render() {
        ctx.save();
        if (shake > 0)
          ctx.translate(
            random(-shake * 8, shake * 8),
            random(-shake * 5, shake * 5),
          );
        drawSky();
        drawRoad();
        objects.sort((a, b) => a.z - b.z);
        for (const object of objects) drawObject(object);
        drawPlayer();
        drawParticles();
        drawWeather();
        ctx.restore();
      }
      function loop(time) {
        const dt = Math.min(0.035, (time - lastTime) / 1000 || 0);
        lastTime = time;
        update(dt);
        render();
        requestAnimationFrame(loop);
      }
      function keyboard(event) {
        if (event.code === "ArrowLeft" || event.code === "KeyA") move(-1);
        if (event.code === "ArrowRight" || event.code === "KeyD") move(1);
        if (
          event.code === "ArrowUp" ||
          event.code === "KeyW" ||
          event.code === "Space"
        ) {
          event.preventDefault();
          if (!running && !ended) resetGame();
          else jump();
        }
        if (event.code === "ArrowDown" || event.code === "KeyS") slide();
        if (event.code === "KeyP") togglePause();
      }
      function pointerDown(event) {
        pointerOrigin.x = event.clientX;
        pointerOrigin.y = event.clientY;
      }
      function pointerEnd(event) {
        const dx = event.clientX - pointerOrigin.x;
        const dy = event.clientY - pointerOrigin.y;
        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30)
          move(dx > 0 ? 1 : -1);
        else if (Math.abs(dy) > 30) dy < 0 ? jump() : slide();
        else if (!running) resetGame();
      }
      function bind() {
        window.addEventListener("resize", resize);
        window.addEventListener("keydown", keyboard);
        canvas.addEventListener("pointerdown", pointerDown);
        canvas.addEventListener("pointerup", pointerEnd);
        ui.start.addEventListener("click", resetGame);
        ui.pause.addEventListener("click", togglePause);
        document
          .getElementById("left")
          .addEventListener("click", () => move(-1));
        document
          .getElementById("right")
          .addEventListener("click", () => move(1));
        document.getElementById("jump").addEventListener("click", jump);
        document.getElementById("slide").addEventListener("click", slide);
      }
      resize();
      bind();
      ui.high.textContent = high;
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
